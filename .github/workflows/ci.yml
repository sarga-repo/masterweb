name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CMS
            directory: cms
            command: pnpm test:mail && pnpm exec tsc --noEmit && pnpm build
          - name: Gateway
            directory: frontend-gateway
            command: pnpm quality
          - name: Motorsport
            directory: frontend-motorsport
            command: pnpm format:check && pnpm lint && pnpm typecheck && pnpm build
          - name: Horse Sport
            directory: frontend-horsesport
            command: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Activate locked pnpm version
        run: corepack enable && corepack prepare pnpm@10.22.0 --activate

      - name: Install locked dependencies
        working-directory: ${{ matrix.directory }}
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        working-directory: ${{ matrix.directory }}
        env:
          CI: "true"
          NODE_ENV: production
          APP_KEYS: ci-app-key-1,ci-app-key-2,ci-app-key-3,ci-app-key-4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret
          ENCRYPTION_KEY: ci-encryption-key
          SEED_DEMO_CONTENT: "false"
          MAIL_ENABLED: "false"
          MAIL_NOTIFICATIONS_ENABLED: "false"
        run: ${{ matrix.command }}
