# Local development model:
#   - `postgres` runs in Docker and starts by default (`docker compose up -d postgres`).
#   - Strapi and all three frontends normally run on the HOST (see README / docs/13).
#   - The containerized app services below are opt-in via the `apps` profile:
#       docker compose --profile apps up --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: sarga-postgres-local
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sarga_strapi}
      POSTGRES_USER: ${POSTGRES_USER:-sarga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sarga_local_password}
    volumes:
      - sarga_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sarga} -d ${POSTGRES_DB:-sarga_strapi}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    container_name: sarga-strapi-local
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/strapi.Dockerfile
    restart: unless-stopped
    # Strapi cryptographic material must be identical for host and container
    # processes sharing this database. Loading cms/.env prevents API/admin
    # tokens from becoming invalid when switching local run modes.
    env_file:
      - ./cms/.env
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: ${STRAPI_PUBLIC_URL:-http://localhost:1337}
      PROXY_KOA: ${STRAPI_PROXY_KOA:-false}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-sarga_strapi}
      DATABASE_USERNAME: ${POSTGRES_USER:-sarga}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sarga_local_password}
      DATABASE_SSL: "false"
      # Exchange Online mail is opt-in and disabled in local Docker by default.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_AUTH_MODE: ${MAIL_AUTH_MODE:-oauth}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.office365.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_REQUIRE_TLS: ${MAIL_SMTP_REQUIRE_TLS:-true}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sarga}
      MAIL_DEFAULT_REPLY_TO: ${MAIL_DEFAULT_REPLY_TO:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_SMTP_SCOPE: ${MICROSOFT_SMTP_SCOPE:-https://outlook.office365.com/.default}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_BASIC_AUTH_ACKNOWLEDGED: ${MAIL_BASIC_AUTH_ACKNOWLEDGED:-}
      MAIL_BASIC_AUTH_EXPIRES_AT: ${MAIL_BASIC_AUTH_EXPIRES_AT:-}
      MAIL_NOTIFICATIONS_ENABLED: ${MAIL_NOTIFICATIONS_ENABLED:-false}
      MAIL_RECIPIENT_GATEWAY: ${MAIL_RECIPIENT_GATEWAY:-}
      MAIL_RECIPIENT_MOTORSPORT: ${MAIL_RECIPIENT_MOTORSPORT:-}
      MAIL_RECIPIENT_HORSESPORT: ${MAIL_RECIPIENT_HORSESPORT:-}
      MAIL_MAX_ATTEMPTS: ${MAIL_MAX_ATTEMPTS:-5}
      MAIL_WORKER_BATCH_SIZE: ${MAIL_WORKER_BATCH_SIZE:-10}
      MAIL_WORKER_CRON: ${MAIL_WORKER_CRON:-*/1 * * * *}
      # Local-only demo seed; idempotent (see cms/src/seed.ts).
      SEED_DEMO_CONTENT: ${SEED_DEMO_CONTENT:-true}
      # One-shot opt-in migration from legacy Site Page records to the
      # Motorsport page Single Types. Keep false after the first successful run.
      MOTORSPORT_PAGE_SINGLE_TYPES_MIGRATE: ${MOTORSPORT_PAGE_SINGLE_TYPES_MIGRATE:-false}
      # Explicit ownership migration gate: off | dry-run | apply | verify.
      # Never set apply in a long-lived environment variable after a successful run.
      MOTORSPORT_OWNERSHIP_MIGRATION_MODE: ${MOTORSPORT_OWNERSHIP_MIGRATION_MODE:-off}
      # Reversible post-cutover archive of legacy shared Motorsport records.
      MOTORSPORT_LEGACY_RETIREMENT_MODE: ${MOTORSPORT_LEGACY_RETIREMENT_MODE:-off}
      # Backfill missing editorial show* values to true; keep off after verify.
      MOTORSPORT_SHOW_FIELD_DEFAULTS_MODE: ${MOTORSPORT_SHOW_FIELD_DEFAULTS_MODE:-off}
      MOTORSPORT_REVALIDATION_SECRET: ${MOTORSPORT_REVALIDATION_SECRET:-}
      MOTORSPORT_FRONTEND_REVALIDATE_URL: ${MOTORSPORT_FRONTEND_REVALIDATE_URL:-http://frontend-motorsport:3001/api/revalidate}
    volumes:
      - ./cms:/app
      - strapi_node_modules:/app/node_modules
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend-gateway:
    container_name: sarga-frontend-gateway-local
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/frontend-gateway.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - strapi
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Browser-reachable Strapi (media/image URLs).
      NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL:-http://localhost:1337}
      # Server-side content fetch uses the internal service hostname inside the network.
      STRAPI_API_URL: ${STRAPI_API_URL:-http://strapi:1337}
      STRAPI_API_URL_INTERNAL: ${STRAPI_API_URL_INTERNAL:-http://strapi:1337}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      MOTORSPORT_REVALIDATION_SECRET: ${MOTORSPORT_REVALIDATION_SECRET:-}
    volumes:
      - ./frontend-gateway:/app
      - /app/node_modules
      - /app/.next

  frontend-motorsport:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/frontend-motorsport.Dockerfile
    container_name: sarga-frontend-motorsport-local
    restart: unless-stopped
    depends_on:
      - strapi
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_KEY: sarga-motorsport
      # This site is served on 3001 (override the gateway value from .env).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_MOTORSPORT_SITE_URL:-http://localhost:3001}
      NEXT_PUBLIC_GATEWAY_SITE_URL: ${NEXT_PUBLIC_GATEWAY_SITE_URL:-http://localhost:3000}
      # Browser-reachable Strapi (media/image URLs).
      NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL:-http://localhost:1337}
      # Server-side content fetch uses the internal service hostname.
      # Do not inherit a host-only localhost value from the root .env.
      STRAPI_API_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
    ports:
      - "3001:3001"
    volumes:
      - ./frontend-motorsport:/app
      - /app/node_modules
      - /app/.next

  frontend-horsesport:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: docker/frontend-horsesport.Dockerfile
    container_name: sarga-frontend-horsesport-local
    restart: unless-stopped
    depends_on:
      - strapi
    env_file:
      - .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_KEY: sarga-horse-sport
      # This site is served on 3002 (override the gateway value from .env).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_HORSESPORT_SITE_URL:-http://localhost:3002}
      NEXT_PUBLIC_GATEWAY_SITE_URL: ${NEXT_PUBLIC_GATEWAY_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_MOTORSPORT_SITE_URL: ${NEXT_PUBLIC_MOTORSPORT_SITE_URL:-http://localhost:3001}
      # Browser-reachable Strapi (media/image URLs).
      NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL:-http://localhost:1337}
      # Server-side content fetch uses the internal service hostname.
      STRAPI_API_URL: ${STRAPI_API_URL:-http://strapi:1337}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
    ports:
      - "3002:3002"
    volumes:
      - ./frontend-horsesport:/app
      - /app/node_modules
      - /app/.next

volumes:
  sarga_postgres_data:
  strapi_node_modules:
  strapi_uploads:
