services:
  postgres:
    image: postgres:16-alpine
    container_name: sarga-postgres-local
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sarga_strapi}
      POSTGRES_USER: ${POSTGRES_USER:-sarga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sarga_local_password}
    volumes:
      - sarga_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sarga} -d ${POSTGRES_DB:-sarga_strapi}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    container_name: sarga-strapi-local
    build:
      context: .
      dockerfile: docker/strapi.Dockerfile
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-sarga_strapi}
      DATABASE_USERNAME: ${POSTGRES_USER:-sarga}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sarga_local_password}
      DATABASE_SSL: "false"
      APP_KEYS: ${STRAPI_APP_KEYS:-localKey1,localKey2,localKey3,localKey4}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-localApiTokenSalt}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-localAdminJwtSecret}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-localTransferTokenSalt}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-localJwtSecret}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY:-localEncryptionKey}
      # Local-only demo seed; idempotent (see cms/src/seed.ts).
      SEED_DEMO_CONTENT: ${SEED_DEMO_CONTENT:-true}
    volumes:
      - ./cms:/app
      - strapi_node_modules:/app/node_modules
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: sarga-frontend-local
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL:-http://localhost:1337}
      # Server-side content fetch uses the internal service hostname inside the network.
      STRAPI_API_URL: ${STRAPI_API_URL:-http://strapi:1337}
      STRAPI_API_URL_INTERNAL: ${STRAPI_API_URL_INTERNAL:-http://strapi:1337}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - strapi

volumes:
  sarga_postgres_data:
  frontend_node_modules:
  strapi_node_modules:
  strapi_uploads:
